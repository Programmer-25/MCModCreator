<input id="prompt" placeholder="Describe your mod">
<button onclick="generate()">Generate Mod</button>

<script>
function sanitize(text) {
    return text
        .toLowerCase()
        .replace(/[^a-z0-9]+/g, "_")
        .replace(/^_+|_+$/g, "");
}

async function generate() {
    const prompt = document.getElementById("prompt").value;

    const response = await fetch("zoomify-2.15.2+1.21.11.jar");
    const blob = await response.blob();

    const filename = `${sanitize(prompt || "ai_mod")}.jar`;

    const url = URL.createObjectURL(blob);

    const a = document.createElement("a");
    a.href = url;
    a.download = filename;
    a.click();

    URL.revokeObjectURL(url);
}
</script>
