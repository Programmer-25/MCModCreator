<!DOCTYPE html>
<html>
<head>
    <title>AI Minecraft Mod Generator</title>

    <style>
        body {
            background: #0f0f0f;
            color: #00ff88;
            font-family: monospace;
            text-align: center;
            margin-top: 80px;
        }

        input {
            width: 400px;
            padding: 10px;
            font-size: 16px;
            margin-top: 10px;
        }

        button {
            padding: 12px 25px;
            margin-top: 15px;
            font-size: 16px;
            cursor: pointer;
            background: #00ff88;
            border: none;
            color: black;
            font-weight: bold;
        }

        #status {
            margin-top: 30px;
            white-space: pre-line;
        }

        .box {
            border: 1px solid #00ff88;
            padding: 30px;
            width: 500px;
            margin: auto;
            box-shadow: 0 0 20px #00ff8840;
        }
    </style>
</head>

<body>

<div class="box">

    <h1>🤖 AI Minecraft Mod Generator</h1>

    <input id="prompt" placeholder="Describe your mod idea...">

    <br>

    <button onclick="generate()">Generate Mod</button>

    <div id="status"></div>

</div>

<script src="script.js"></script>

</body>
</html>
